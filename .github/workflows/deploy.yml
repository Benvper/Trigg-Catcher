name: CI & Deploy to Trigger.dev

# Push to main: typecheck only, catches broken code early. Nothing ever
# deploys automatically. Deploying (staging or prod) is always a manual,
# explicit action — run this workflow from the Actions tab and choose the
# environment. Staging requires a paid Trigger.dev plan; on the free plan,
# only "prod" will actually succeed.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to"
        required: true
        default: prod
        type: choice
        options:
          - staging
          - prod

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run typecheck

  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci

      - name: Deploy to Trigger.dev
        env:
          TRIGGER_ACCESS_TOKEN: ${{ secrets.TRIGGER_ACCESS_TOKEN }}
        run: npx trigger.dev@4.5.9 deploy --env "${{ inputs.environment }}"
